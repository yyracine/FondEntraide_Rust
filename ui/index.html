<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fonds d'Entraide</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="bandeau" class="bandeau" hidden></div>

    <header class="entete">
      <div class="marque">
        <span class="pastille" aria-hidden="true"></span>
        <div>
          <h1>Fonds d'Entraide</h1>
          <p class="sous-titre">Registre des cotisations familiales</p>
        </div>
      </div>
      <div class="recherche-globale">
        <input
          id="recherche-membre"
          type="search"
          placeholder="Encaisser pour un membre : nom ou prénom…"
          autocomplete="off"
        />
        <div class="resultats" id="resultats-membres" hidden></div>
      </div>
      <div class="compteurs" id="compteurs"></div>
    </header>

    <main class="piste">
      <section class="colonne">
        <h2>Clans</h2>
        <div class="liste" id="liste-clans"></div>
      </section>
      <section class="colonne">
        <h2>Grandes familles</h2>
        <div class="liste" id="liste-gf"></div>
      </section>
      <section class="colonne">
        <h2>Lignées</h2>
        <div class="liste" id="liste-lignees"></div>
      </section>
      <section class="colonne">
        <h2>Familles</h2>
        <div class="liste" id="liste-familles"></div>
      </section>
    </main>

    <section class="membres">
      <div class="barre">
        <div>
          <h2 id="titre-membres">Membres</h2>
          <p class="fil" id="fil"></p>
        </div>
        <div class="barre-outils">
          <input
            id="recherche"
            type="search"
            placeholder="Rechercher un nom ou un prénom…"
            autocomplete="off"
          />
          <button type="button" class="secondaire" id="nouveau-membre">
            Nouveau membre
          </button>
        </div>
      </div>
      <div class="annees" id="annees"></div>
      <div class="tableau">
        <table>
          <thead>
            <tr>
              <th>Nom</th>
              <th>Prénom</th>
              <th>Statut</th>
              <th class="droite" id="th-paye">Payé</th>
              <th class="droite" id="th-reste">Reste</th>
              <th class="droite" id="th-arrieres">Arriérés</th>
              <th>Parent</th>
              <th>Fiche</th>
            </tr>
          </thead>
          <tbody id="corps-membres"></tbody>
        </table>
      </div>
      <p class="compte" id="compte-membres"></p>
    </section>

    <div class="voile" id="voile" hidden>
      <div class="feuille" role="dialog" aria-modal="true" aria-labelledby="feuille-titre">
        <header class="feuille-entete">
          <div>
            <h3 id="feuille-titre">Encaisser</h3>
            <p class="fil" id="feuille-perimetre"></p>
            <p class="fil" id="feuille-chemin"></p>
          </div>
          <button type="button" class="fermer" id="fermer-feuille" aria-label="Fermer">×</button>
        </header>

        <div class="feuille-corps">
          <div class="annees" id="annees-feuille"></div>

          <div class="soldes" id="feuille-soldes"></div>

          <div class="champs">
            <label class="champ">
              <span>Montant (FCFA)</span>
              <input id="montant" type="number" min="1" step="1" inputmode="numeric" />
            </label>
            <label class="champ">
              <span>Date du versement</span>
              <input id="date-paiement" type="date" />
            </label>
            <label class="champ">
              <span>Mode</span>
              <select id="mode">
                <option value="especes">Espèces</option>
                <option value="mobile_money">Mobile money</option>
                <option value="virement">Virement</option>
                <option value="cheque">Chèque</option>
                <option value="autre">Autre</option>
              </select>
            </label>
          </div>

          <div class="repartition" id="repartition" hidden></div>

          <p class="note" id="note"></p>

          <div class="actions">
            <button type="button" class="secondaire" id="ouvrir-historique">
              Historique des versements
            </button>
            <button type="button" class="primaire" id="encaisser">Enregistrer le versement</button>
          </div>

          <div class="recu" id="recu" hidden></div>
        </div>
      </div>
    </div>

    <div class="voile" id="voile-fiche" hidden>
      <div class="feuille" role="dialog" aria-modal="true" aria-labelledby="fiche-titre">
        <header class="feuille-entete">
          <div>
            <h3 id="fiche-titre">Fiche</h3>
            <p class="fil" id="fiche-chemin"></p>
          </div>
          <div class="fiche-outils">
            <button type="button" class="secondaire" id="modifier-membre">Modifier</button>
            <button type="button" class="fermer" id="fermer-fiche" aria-label="Fermer">×</button>
          </div>
        </header>

        <div class="feuille-corps">
          <div class="soldes" id="fiche-soldes"></div>

          <h4 class="fiche-section">Grille des 12 mois</h4>
          <div class="grille" id="fiche-grille"></div>

          <h4 class="fiche-section">Versements</h4>
          <div class="versements" id="fiche-versements"></div>
        </div>
      </div>
    </div>

    <div class="voile" id="voile-membre" hidden>
      <div class="feuille" role="dialog" aria-modal="true" aria-labelledby="membre-titre">
        <header class="feuille-entete">
          <div>
            <h3 id="membre-titre">Nouveau membre</h3>
            <p class="fil" id="membre-famille"></p>
          </div>
          <button type="button" class="fermer" id="fermer-membre" aria-label="Fermer">×</button>
        </header>

        <div class="feuille-corps">
          <div class="champs">
            <label class="champ">
              <span>Nom *</span>
              <input id="m-nom" type="text" autocomplete="off" />
            </label>
            <label class="champ">
              <span>Prénom</span>
              <input id="m-prenom" type="text" autocomplete="off" />
            </label>
            <label class="champ">
              <span>Téléphone</span>
              <input id="m-telephone" type="text" autocomplete="off" />
            </label>
            <label class="champ">
              <span>Sexe</span>
              <select id="m-sexe">
                <option value="">—</option>
                <option value="M">Masculin</option>
                <option value="F">Féminin</option>
              </select>
            </label>
            <label class="champ">
              <span>Statut</span>
              <select id="m-statut">
                <option value="actif">Actif</option>
                <option value="inactif">Inactif</option>
                <option value="parti">Parti</option>
                <option value="decede">Décédé</option>
                <option value="suspendu">Suspendu</option>
              </select>
            </label>
            <label class="champ">
              <span>Ordre dans la fratrie</span>
              <input id="m-ordre" type="number" min="1" step="1" />
            </label>
            <label class="champ">
              <span>Date d'entrée</span>
              <input id="m-entree" type="date" />
            </label>
            <label class="champ">
              <span>Date de sortie</span>
              <input id="m-sortie" type="date" />
            </label>
            <label class="champ">
              <span>Parent dans la famille</span>
              <select id="m-parent"></select>
            </label>
          </div>

          <label class="champ">
            <span>Notes</span>
            <textarea id="m-notes" rows="2"></textarea>
          </label>

          <p class="note" id="m-note"></p>

          <div class="actions">
            <button type="button" class="lien danger" id="supprimer-membre" hidden>
              Supprimer le membre
            </button>
            <button type="button" class="secondaire" id="annuler-membre">Annuler</button>
            <button type="button" class="primaire" id="enregistrer-membre">Enregistrer</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Feuille d'impression : seule visible en @media print. -->
    <div id="impression" class="impression"></div>

    <script src="app.js"></script>
  </body>
</html>
