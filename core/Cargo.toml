[package]
name = "fonds-core"
version = "0.1.0"
edition = "2021"
description = "Cœur métier du Fonds d'Entraide — indépendant de l'interface (Tauri)"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
